services:
  gigaam:
    build: ./gigaam
    environment:
      MODEL_NAME: v3_e2e_rnnt
      DEVICE: cpu
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - gigaam-cache:/root/.cache/gigaam
      - gigaam-vad-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    restart: unless-stopped
  voxcpm2:
    build: ./voxcpm2
    environment:
      MODEL_ID: openbmb/VoxCPM2
      DEVICE: cpu
    volumes:
      - voxcpm2-cache:/model-cache
    ports:
      - "8001:8000"
    restart: unless-stopped

volumes:
  gigaam-cache:
  gigaam-vad-cache:
  voxcpm2-cache:
