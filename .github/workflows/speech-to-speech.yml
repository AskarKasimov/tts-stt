name: Speech-to-speech deployment checks

on:
  push:
    paths:
      - 'speech-to-speech/**'
      - '.github/workflows/speech-to-speech.yml'
  pull_request:
    paths:
      - 'speech-to-speech/**'
      - '.github/workflows/speech-to-speech.yml'
  workflow_dispatch:

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP test dependencies
        run: python3 -m pip install -c speech-to-speech/constraints.lock packaging fastapi httpx python-multipart prometheus-client
      - name: Install audio decoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check failure handling without model weights
        run: python3 -m unittest discover -s speech-to-speech/tests -v
      - name: Check launcher and Docker Compose syntax
        run: |
          bash -n speech-to-speech/run.sh
          docker compose -f speech-to-speech/compose.yaml config --quiet
