name: HTTP API

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gigaam, voxcpm2]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install HTTP test dependencies
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: '2.0.3'
        run: uv sync --locked --only-group ci-api --no-install-project
      - name: Check HTTP API without model weights
        run: uv run --no-sync python -m pytest -q tests/test_api.py
