# Self-contained adaptation of the pinned upstream qwen3_omni_moe.yaml.
# Thinker INT4 W4A16; voice stages BF16. All stages share one physical GPU.
async_chunk: true
dtype: bfloat16
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 25
      codec_left_context_frames: 25
stages:
  - stage_id: 0
    devices: "0"
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.60
    max_num_seqs: 1
    max_model_len: 4096
    max_num_batched_tokens: 4096
    enforce_eager: true
    enable_prefix_caching: false
    trust_remote_code: false
    limit_mm_per_prompt:
      audio: 1
      image: 0
      video: 0
    compilation_config:
      custom_ops: ["+rotary_embedding"]
    default_sampling_params:
      temperature: 0.0
      max_tokens: 256
  - stage_id: 1
    devices: "0"
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.20
    max_num_seqs: 1
    max_model_len: 4096
    max_num_batched_tokens: 4096
    enforce_eager: true
    enable_prefix_caching: false
    trust_remote_code: false
    # The checkpoint quantizes thinker.model.layers only.
    hf_overrides:
      quantization_config: null
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      seed: 42
      temperature: 0.9
      top_k: 50
      max_tokens: 2048
      repetition_penalty: 1.05
  - stage_id: 2
    devices: "0"
    gpu_memory_utilization: 0.08
    max_num_seqs: 1
    max_num_batched_tokens: 65536
    enforce_eager: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    trust_remote_code: false
    hf_overrides:
      quantization_config: null
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.1
