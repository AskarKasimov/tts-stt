# HTTP integration only: fake engine, no real model, no GPU, no published ports.
name: qwen3-speech-cpu-test
services:
  fake:
    init: true
    image: tts-stt/qwen3-omni-int4:9842ebc
    environment:
      NVIDIA_VISIBLE_DEVICES: void
    entrypoint: [python3, /checks/integration.py, fake]
    volumes:
      - ./tests:/checks:ro
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')"]
      interval: 1s
      timeout: 3s
      retries: 20
  api:
    init: true
    image: tts-stt/qwen3-omni-int4:9842ebc
    environment:
      NVIDIA_VISIBLE_DEVICES: void
      OMNI_URL: http://fake:8091
    entrypoint: [uvicorn, "api:app", --host, "0.0.0.0", --port, "8000", --workers, "1"]
    depends_on:
      fake:
        condition: service_healthy
  probe:
    init: true
    image: tts-stt/qwen3-omni-int4:9842ebc
    environment:
      NVIDIA_VISIBLE_DEVICES: void
    entrypoint: [python3, /checks/integration.py, probe]
    volumes:
      - ./tests:/checks:ro
    depends_on:
      api:
        condition: service_started
