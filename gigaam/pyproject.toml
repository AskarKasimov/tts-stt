[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gigaam"
version = "0.2.0"
description = "GigaAM: A package for audio modeling and ASR."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "GigaChat Team" },
]

dependencies = [
    "hydra-core==1.3.*",
    "numpy==2.*",
    "omegaconf==2.3.*",
    "onnx>=1.21,<1.22",
    "onnxruntime>=1.24.1,<1.25",
    "soundfile",
    "sentencepiece",
    "tqdm",
]

[project.optional-dependencies]
# Why torch is optional: often preinstalled and reinstall is slow.
# Older builds also work, pinned extras are recommended.
torch = [
    "torch>=2.6",
    "torchaudio>=2.6",
]
api = [
    "fastapi",
    "prometheus-client",
    "uvicorn",
    "python-multipart",
]
longform = [
    "numba>=0.62",
    "pyannote.audio==4.0.*",
    "pyarrow>=23",
    "torch==2.10.*",
    "torchaudio==2.10.*",
    "torchcodec==0.10",
    "transformers==5.*",
]
tests = [
    "pytest",
    "pytest-cov",
    "scipy",
    "httpx",
    "fastapi",
    "python-multipart",
]
lint = [
    "black==26.1.0",
    "isort==7.0.0",
    "flake8==7.3.0",
    "mypy",
    "types-requests",
]

[dependency-groups]
ci-api = [
    "fastapi",
    "httpx",
    "numpy",
    "prometheus-client",
    "pytest",
    "python-multipart",
    "soundfile",
]

[project.urls]
Homepage = "https://github.com/salute-developers/GigaAM/"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
include = ["gigaam"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
markers = [
    "full: full model-revision tests that download every checkpoint",
    "partial: lightweight subset of model-revision tests",
]
